; ESP32-S3 CYD Hermes Client
; LVGL dashboard + KWS wakeword + WebSocket bridge + ES8311 audio

[env:esp32-s3-cyd-hermes]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
framework = arduino
board_build.partitions = default_16MB.csv

monitor_speed = 115200

lib_deps =
  lvgl/lvgl@8.3.11
  esp32async/ESPAsyncWebServer
  zlatko.cyrus/ESP32_KWS@1.2.1
  bblanchon/ArduinoJson@6.21.5
  tzapen/WiFiManager@2.0.17
  esphome/ESP32AudioKit@0.0.1
  zmeirey/ESP32_I2S_ES8311@1.0.0

build_flags =
  -D CONFIG_LV_LZV_MEM_COMPRESS=1
  -D CONFIG_LV_MEM_CUSTOM=1
  -D LV_MEM_SIZE="(64 * 1024)"
  -D CONFIG_WSS_WIPE=1
  -D CONFIG_WSS_MODEL=1
